const VM_GUIDES=[
 {n:"01",title:"Install VirtualBox (your hypervisor)",lv:"beg",
  why:"A hypervisor runs other 'virtual' computers safely inside windows on your real PC. Break a VM and your actual machine is untouched. This is the foundation of the entire lab.",
  steps:["Go to virtualbox.org → download VirtualBox for your OS.","Run the installer, accept defaults (it briefly drops your network — normal).","Download the matching Extension Pack from the same page; double-click to add USB/webcam support.","Launch it. The empty left panel is where your VMs will live."],
  tip:"If VMs refuse to start, enable virtualization in BIOS: reboot → BIOS (Del/F2) → find 'Intel VT-x' or 'AMD-V' → Enabled.",
  warn:"'VT-x is disabled' = that BIOS setting, ~95% of the time."},
 {n:"02",title:"Create your first VM (Ubuntu or Windows)",lv:"beg",
  why:"Your practice machine. You'll run A+ commands, install OSes, and break things freely here.",
  steps:["Download an ISO: Ubuntu Desktop (ubuntu.com) is the easiest start; or the Win10/11 ISO from Microsoft.","VirtualBox → New → name it, pick OS type, give 4096 MB RAM + 2 CPUs.","Create a virtual disk (VDI, dynamically allocated, 40 GB).","Select VM → Settings → Storage → disk icon → choose your ISO → Start.","Follow the installer like a real PC. Done = a working computer in a window."],
  tip:"Immediately after install, take a Snapshot (Machine → Take Snapshot) so you can always roll back to clean.",
  warn:"Never give a VM more than HALF your real RAM or the host crawls."},
 {n:"03",title:"Master Snapshots (your safety net)",lv:"beg",
  why:"Snapshots freeze a VM's exact state. Snapshot before risky experiments, restore instantly if it breaks — this is what makes a home lab fearless.",
  steps:["Select a VM → open Snapshots view.","Click Take, name it 'clean-install'.","Run your experiment (install tools, change settings).","To undo everything: power off → select snapshot → Restore."],
  tip:"Name snapshots by what they represent: 'before-firewall', 'kali-ready'."},
 {n:"04",title:"Build a virtual network (pfSense firewall)",lv:"int",
  why:"Network+ is learned by doing. pfSense is a free firewall/router VM you place between other VMs to practice subnets, NAT, DHCP, and firewall rules.",
  steps:["Download pfSense CE from pfsense.org.","New VM (type: BSD/FreeBSD 64-bit), attach the ISO, install.","Give pfSense two adapters: one 'NAT' (WAN/internet) and one 'Internal Network' (LAN).","Set your other VMs' adapter to that same 'Internal Network' name — now they route through pfSense.","Browse to pfSense's LAN IP from a VM to reach the web admin and set rules."],
  tip:"This one setup covers most of the Network+ hands-on domain: subnetting, NAT, DHCP, firewall rules.",
  warn:"Every VM sharing the same 'Internal Network' name shares that virtual switch."},
 {n:"05",title:"Capture traffic with Wireshark",lv:"int",
  why:"Reading packets is the highest-value SOC skill. Wireshark shows the real conversations on a network — you'll literally watch a TCP handshake and a DNS lookup.",
  steps:["Install Wireshark (wireshark.org).","Pick your active interface, click the blue shark-fin to capture.","Filter bar: type <code>dns</code>, enter — watch name lookups appear.","Try <code>tcp.flags.syn==1</code> to isolate TCP handshake starts.","Right-click a packet → Follow → TCP Stream to read a full exchange."],
  tip:"Capture while loading a website, then filter 'http' and 'dns' to see every step your browser took.",
  warn:"Only capture on networks you own or are authorized to monitor."},
 {n:"06",title:"Install Sysmon (see what Windows hides)",lv:"beg",
  why:"Default Windows logging misses a lot. Sysmon (free, from Microsoft Sysinternals) adds rich detail — process creation with command lines, network connections, file hashes. This is the telemetry real SOCs run on, and it makes your lab investigations actually realistic.",
  steps:["On your Windows VM, download Sysmon from Microsoft Sysinternals.","Grab a community config (search 'SwiftOnSecurity sysmon-config') — it's a sane starting ruleset.","Open an admin PowerShell, run: <code>sysmon -accepteula -i sysmonconfig.xml</code>.","Open Event Viewer → Applications and Services → Microsoft → Windows → Sysmon → Operational.","Launch any program and watch the Event ID 1 (process create) entries appear with full command lines."],
  tip:"Sysmon Event ID 1 = process creation, 3 = network connection, 11 = file created. These three carry most investigations.",
  warn:"Take a snapshot before installing so you can roll back cleanly."},
 {n:"07",title:"Hunt in Windows Event Logs",lv:"int",
  why:"Reading Windows Event Logs is THE core Tier-1 skill. You'll spot a brute-force attack by its fingerprint — a flood of failed logons followed by a success. This is a perfect first portfolio piece.",
  steps:["On your Windows VM, deliberately fail several RDP/local logins, then succeed.","Event Viewer → Windows Logs → Security.","Filter for Event ID <code>4625</code> (failed logon) — see your failures stack up.","Find the <code>4624</code> (successful logon) right after — that's the 'break-in' moment.","Note the source IP, account, and timestamps — write it up like an incident: who/what/when/where + ATT&CK T1110 (Brute Force)."],
  tip:"Key IDs: 4625 fail, 4624 success, 4688 process created, 4720 user account created, 4672 admin logon. Memorize these five.",
  warn:"Only do this in your own lab VM."},
 {n:"08",title:"Analyze a phishing email",lv:"int",
  why:"Phishing is the #1 way attacks start, and phishing triage is bread-and-butter Tier-1 work. Learning to read email headers and pull indicators is directly job-relevant and another strong portfolio piece.",
  steps:["Get a sample: use a phishing room on TryHackMe, or a (safe, text-only) sample from a phishing-analysis dataset.","View the raw email source / full headers.","Trace the 'Received:' chain to find the true origin IP (not the friendly 'From' name).","Check SPF/DKIM/DMARC results in the headers — failures are red flags.","Extract IOCs: sender IP, sender domain, any URLs/attachment hashes.","Look up each IOC on VirtualTotal / AbuseIPDB. Write a verdict: phish or legit, and why."],
  tip:"NEVER click links or open attachments from a real sample outside an isolated VM. Work from headers and text.",
  warn:"Do attachment detonation only inside an isolated, snapshotted VM with no access to your real network."},
 {n:"09",title:"Enrich indicators with threat intel",lv:"int",
  why:"Enrichment — turning a bare IP or hash into 'known APT infrastructure' or 'clean' — is something you'll do dozens of times a shift. Building the habit now makes you fast later.",
  steps:["Take any suspicious IP, domain, URL, or file hash (from your logs or a lab).","VirusTotal: paste it — how many engines flag it? Check the 'Relations' and 'Behavior' tabs.","AbuseIPDB: look up an IP's abuse history and confidence score.","Cross-reference: does the ATT&CK technique, the IP reputation, and the file behavior tell one consistent story?","Record your enrichment in your notes — this is exactly what goes in an escalation."],
  tip:"A single 'clean' result isn't proof of safety — correlate multiple sources and the behavior in your own logs.",
  warn:"Uploading a real internal file to VirusTotal makes it public — in a real job, check policy first. Fine for lab samples."},
 {n:"10",title:"Stand up your own SIEM (the capstone)",lv:"adv",
  why:"This IS the SOC Tier-1 job in miniature. You'll forward logs from your VMs into a SIEM and triage real alerts — pulling together Sysmon, event logs, and enrichment from the earlier labs.",

  tip:"Pair with TryHackMe's 'SOC Level 1' path — do a guided room, then replicate it in your own SIEM. Document the whole thing as your flagship portfolio project.",

];

   GOOGLE IT SUPPORT — COURSE 1: TECHNICAL SUPPORT FUNDAMENTALS
   Cards transcribed from Kingsley's fact-checked printable flashcards.
   C(term,def) = main card · X(term,def) = bonus term · P(question,answer,detail) = point-out
   map = CURRICULUM indexes that cover the same ground (crosswalk)
==================================================================== */
function C(t,d){return{k:"m",t,d};}
function X(t,d){return{k:"b",t,d};}
function P(t,a,d){return{k:"p",t,a,d};}
const GIT_MODULES=[
{m:1,title:"Introduction to IT",focus:"What IT support is, the people who built computing, binary, character encoding, and the four layers of a computer.",map:[0,5],
 cards:[
  C("Information Technology (IT)","Using technology, like computers and the internet, to store and process data into useful information."),
  C("IT Support Roles","The five parts of the job: Managing, Installing, Maintaining, Troubleshooting, and Configuring."),
  C("Computer","A device that stores and processes data by performing calculations."),
  C("Charles Babbage","Designed the Difference Engine (1820s) and the Analytical Engine (1837), an early general-purpose computer designed to read punch cards. He did not invent punch cards."),
  C("Algorithm","A series of steps that solves a specific problem."),
  C("Compiler","A program that translates code written in a human-readable programming language into machine code the computer can run."),
  C("Grace Hopper","Made the first compiler, called A-0, in 1952. Her later work led to COBOL, one of the first widely used programming languages."),
  C("Linux","A widely used open-source operating system, released by Linus Torvalds in 1991."),
  C("PDA","Personal Digital Assistant. An early handheld computer, like the Palm Pilot, and a predecessor of the smartphone."),
  C("Ada Lovelace","Published notes in 1843 containing the first computer algorithm, written for Babbage's Analytical Engine. Often called the first computer programmer."),
  C("Alan Turing","Created the Turing machine (1936). Co-created the Turing–Welchman Bombe, which helped crack Nazi Enigma messages in World War II."),
  C("Margaret Hamilton","Led the team that wrote the onboard flight software for NASA's Apollo missions, including Apollo 11 (1969). Early at MIT, she wrote weather-prediction software."),
  C("Binary","The number system computers use to communicate and store data. It is base-2 and uses only 1s and 0s."),
  C("Base-2","A number system that uses only two digits, 0 and 1. Also called binary."),
  C("Bit","Short for binary digit. A single 1 or 0, and the smallest unit of data."),
  C("Byte","A group of 8 bits. One byte has 256 possible values (0–255)."),
  C("Character Encoding","Assigns binary values to characters so that humans can read them."),
  C("ASCII","American Standard Code for Information Interchange. A character encoding for the English alphabet, digits 0–9, and punctuation marks."),
  C("UTF-8","A character encoding that stores each character in 1 to 4 bytes, so it can represent far more characters than ASCII."),
  C("Abstraction","Taking a complex system and simplifying it for our use. It hides the complicated parts behind a simple, common interface."),
  C("Computer Architecture","The layers that make up a computer and how they work together: hardware, operating system, software, and user."),
  C("Hardware Layer","The physical parts of a computer you can touch, such as the CPU, RAM, and hard drive."),
  C("Operating System (OS) Layer","Lets the hardware communicate with the system. The OS manages the hardware and lets programs use it. Examples: Windows, macOS, Linux."),
  C("Software Layer","How we humans interact with the computer, through programs and applications."),
  C("User Layer","The person who interacts with the computer. It's the most important layer, also called the human element."),
  X("Analytical Engine","A general-purpose mechanical computer designed by Charles Babbage in the 1830s. It was never fully built. Ada Lovelace wrote the first algorithm for it."),
  X("Configuring","Setting up a system's settings and options so it works the way it should."),
  X("Troubleshooting","Finding and fixing the cause of a technical problem."),
  X("Interface","The point where a user and a system, or two systems, meet and interact. Examples: a steering wheel, a keyboard, a touchscreen."),
  X("Open Source","Software whose source code is public, so anyone can view, change, and share it."),
  X("Programming Language","A special language people use to write instructions for a computer, such as Python or C."),
  X("Turing Machine","A theoretical machine Alan Turing described in 1936. In principle, it can carry out any calculation a modern computer can. The foundation of computer science."),
  X("Unicode","The worldwide standard that gives a number to almost every character in every written language, plus emoji. UTF-8 is the most common way to store it."),
  P("Lowercase “a” in ASCII binary","01100001","Decimal 97 (64 + 32 + 1). Uppercase “A” is 65."),
  P("Max value of one byte","255","Zero counts as a value, so a byte holds 256 values in total (2^8 = 256)."),
  P("01101000 in decimal","104","64 + 32 + 8 = 104, which is the letter “h” in ASCII."),
  P("45 in binary","00101101","32 + 8 + 4 + 1 = 45"),
  P("Bytes per character in UTF-8","1 to 4 bytes","The first 128 characters match ASCII and use 1 byte."),
  P("The 4 architecture layers, bottom to top","Hardware → Operating System → Software → User",""),
  P("Who first used punch cards to run a machine?","Joseph Marie Jacquard","On a weaving loom in the early 1800s. Babbage later designed the Analytical Engine to read them."),
 ]},
{m:2,title:"Hardware",focus:"Inside the box: CPU, RAM, buses, motherboard, storage, ports and cables, power, mobile devices, and the startup sequence.",map:[0,1,2,3,15,16,17,18,28],
 cards:[
  C("Address Bus","Connects the CPU to the MCC (memory controller chip) and sends over the location of the data, but not the data itself."),
  C("ATA","Advanced Technology Attachment. The interface standard hard drives use to connect to the system. SATA (Serial ATA) is the modern version used today."),
  C("ATX (Advanced Technology eXtended)","The most common form factor for motherboards."),
  C("Backward Compatible","Newer hardware or software still works with older versions. Example: a USB 3.0 port still accepts a USB 2.0 device."),
  C("BIOS (Basic Input/Output System)","Software that helps initialize the hardware in our computer and gets our operating system up and running. It's stored on a ROM chip on the motherboard."),
  C("BYOD (Bring Your Own Device)","The practice of allowing people to use their own personal devices for work."),
  C("Cache","A storage location for recently or frequently accessed data, so it can be reached faster. On a mobile app, it's where anything changed or created with that app is stored."),
  C("Charge Cycle","One full charge and discharge of a battery."),
  C("Chipset","Decides how components talk to each other on our machine. Traditionally made up of the northbridge and southbridge."),
  C("Clock Cycle","One pulse of voltage sent to the clock wire."),
  C("Clock Speed","The maximum number of clock cycles a CPU can handle in a set amount of time. Measured in hertz, usually gigahertz (GHz)."),
  C("Clock Wire","When you send or receive data, a voltage is sent to the clock wire to let the CPU know it can start doing calculations."),
  C("CPU","Central Processing Unit. The “brain” of the computer that runs instructions and performs calculations."),
  C("CPU Socket","A series of pins that connects the CPU to the motherboard."),
  C("Data Sizes","Units that measure amounts of data, including bit, byte, kilobyte, kibibyte, and megabyte."),
  C("DDR SDRAM (Double Data Rate SDRAM)","A type of RAM that is faster, uses less power, and has a larger capacity than earlier SDRAM versions."),
  C("Desktop","The main screen where we can navigate our files, folders, and applications."),
  C("DIMM","Dual Inline Memory Module. The stick of RAM that plugs into the motherboard."),
  C("DisplayPort","A port that outputs both audio and video."),
  C("DRAM","Dynamic Random Access Memory. The type of RAM used in most computers."),
  C("Drivers","Contain the instructions our CPU needs to understand external devices like keyboards, webcams, and printers."),
  C("DVI","A cable that generally outputs video only, no audio."),
  C("Electrostatic Discharge (ESD)","A sudden, momentary flow of electric current between two electrically charged objects, caused by contact, an electrical short, or dielectric breakdown. It can damage computer parts."),
  C("External Data Bus (EDB)","A row of wires that interconnects the parts of our computer and carries the actual data."),
  C("Factory Reset","Resetting a device to the settings it came with from the factory."),
  C("Form Factor","The size, shape, and layout of a hardware component. Example: ATX and ITX are motherboard form factors."),
  C("Hard Drive","A long-term storage component that holds all of our data, including music, pictures, and applications."),
  C("Hardware","The physical devices and equipment, internal or external, that make up a computer and help it perform its functions."),
  C("HDD (Hard Disk Drive)","Uses a spinning platter and a mechanical arm to read and write information."),
  C("HDMI","A type of cable that outputs both video and audio."),
  C("Heat Sink","Used to dissipate heat from our CPU."),
  C("Instruction Set","A list of instructions that our CPU is able to run."),
  C("ITX (Information Technology eXtended)","A form factor for motherboards that is much smaller than ATX boards."),
  C("LGA (Land Grid Array)","A type of CPU socket where the pins stick out of the motherboard. The CPU has flat contacts instead of pins."),
  C("Lightning Connector","Apple's 8-pin, reversible power and data connector for iPhones and iPads. Apple has been replacing it with USB-C since the iPhone 15 (2023)."),
  C("Mb/s","Megabits per second, a unit of data transfer rate. Note the small “b”: bits, not bytes."),
  C("Memory Controller Chip (MCC)","A bridge between the CPU and the RAM."),
  C("Micro DisplayPort","A tiny DisplayPort connector designed for mobile devices. Carries audio and video. Rare in practice; Mini DisplayPort is the common small version."),
  C("Micro HDMI","The smallest HDMI connector (Type D), used on some phones, cameras, and tablets."),
  C("Micro USB","A small, non-reversible USB connector for power and data, common on older Android phones."),
  C("Mini HDMI","A smaller HDMI connector (Type C) than standard HDMI but bigger than Micro HDMI, used on cameras and tablets."),
  C("Mini USB","An older USB connector, bigger than Micro USB, used on older cameras and MP3 players."),
  C("Motherboard","The body or circulatory system of the computer that connects all the pieces together."),
  C("Northbridge","Interconnects fast components like the RAM and video cards with the CPU. In modern CPUs, its job is built into the CPU itself."),
  C("NVMe (NVM Express)","An interface standard that allows greater data throughput and efficiency. Used by fast SSDs that connect through PCI Express."),
  C("Overclocking","Increases the rate of your CPU's clock cycles so it can perform more tasks. It also creates more heat."),
  C("PCI Express (PCIe)","Peripheral Component Interconnect Express. The expansion bus and slots used for cards like graphics cards."),
  C("Peripherals","External devices we connect to our computer that add functionality, like a mouse, a keyboard, and a monitor."),
  C("PGA (Pin Grid Array)","A CPU socket type where the pins are located on the processor itself."),
  C("Ports","Connection points we can plug devices into that extend the functionality of our computer."),
  C("POST (Power-On Self-Test)","Runs when the computer starts up. It figures out what hardware is on the computer and checks that it works."),
  C("Power Supply","Converts electricity from the wall outlet (AC) into a format our computer can use (DC)."),
  C("Programs","Basic instructions that tell the computer what to do."),
  C("RAM","Random Access Memory. Short-term memory that holds data the CPU is using right now. It's erased when the power is off."),
  C("Registers","Small, very fast storage locations inside the CPU that hold the data it's working with."),
  C("Reimaging","Wiping and reinstalling an operating system using a disk image, which is a copy of an operating system."),
  C("RMA (Return Merchandise Authorization)","The approval process for returning a product for a repair, replacement, or refund."),
  C("ROM Chip (Read-Only Memory)","A read-only memory chip where the BIOS is stored."),
  C("RPM","Revolutions per minute. How fast an HDD's platter spins, for example 5,400 or 7,200 RPM. Faster means quicker reads and writes."),
  C("Safe Operating Temperature","The temperature range rechargeable batteries must be kept in to avoid damage."),
  C("SATA (Serial ATA)","The most common interface for connecting drives today. It uses one cable for data transfers (plus a separate power cable)."),
  C("SDRAM","Synchronous DRAM. RAM that is synchronized to the system's clock speed, allowing quicker processing of data."),
  C("SoC (System on a Chip)","Packs the CPU, RAM, and sometimes even the storage onto a single chip."),
  C("Southbridge","Maintains our I/O (input/output) controllers, like hard drives and USB devices that input and output data."),
  C("SSD","Solid State Drive. Stores data on flash memory chips with no moving parts, so it's much faster than an HDD."),
  C("Standoffs","Used to raise and attach your motherboard to the case."),
  C("Thermal Paste","A substance that better connects the CPU and heat sink, so heat transfers from one to the other more effectively."),
  C("Type-C Connector","A reversible USB connector meant to replace many peripheral connections."),
  C("UEFI","Unified Extensible Firmware Interface. The modern replacement for the BIOS."),
  C("USB (Universal Serial Bus)","A connection standard for connecting peripherals to devices such as computers."),
  C("USB-C Adapter","Converts a reversible USB-C port to other connectors. USB-C can carry power, data, and display signals."),
  C("CMOS (Complementary Metal-Oxide Semiconductor)","Stores the BIOS settings, like the date, time, and boot order. A coin-cell CMOS battery keeps them saved when the computer is off."),
  C("Expansion Slots","Slots on the motherboard that let you add cards, like a graphics card, to increase the computer's functionality. PCIe is the standard."),
  C("Voltage","The force that pushes electricity through a circuit. Measured in volts (V)."),
  C("Amperage (Amps)","The amount of electrical current flowing. Measured in amps (A). A device only pulls the amps it needs."),
  C("Wattage","The total power a device uses. Watts = volts × amps. Example: 5 V × 2 A = 10 W."),
  P("Kilobyte (KB) vs. Kibibyte (KiB)","1 KB = 1,000 bytes","1 KiB = 1,024 bytes (2^10). Kibi uses base-2."),
  P("Mb/s vs. MB/s","8 bits = 1 byte","So 100 Mb/s (megabits) is about 12.5 MB/s (megabytes). Internet speeds use Mb/s."),
  P("LGA vs. PGA: where are the pins?","LGA: on the motherboard","PGA: on the CPU."),
  P("Northbridge vs. Southbridge","North = fast stuff","Northbridge connects RAM and video cards. Southbridge handles I/O like hard drives and USB."),
  P("HDMI, DisplayPort, DVI: which carry audio?","HDMI and DisplayPort","DVI generally carries video only."),
  P("Address bus vs. data bus (EDB)","Address = where, data = what","The address bus sends the location. The external data bus carries the data itself."),
  P("What does BIOS stand for?","Basic Input/Output System","Not “Services.”"),
  P("Is SATA a drive?","No, it's an interface","SATA is the connection standard drives use to plug into the motherboard."),
  P("HDD vs. SSD","HDD: spinning platter","SSD: flash chips, no moving parts, faster and more durable."),
  P("Startup order","Power on → BIOS/UEFI → POST → OS loads","The BIOS/UEFI runs POST to check the hardware, then hands off to the operating system."),
  P("How do you prevent ESD?","Ground yourself","Wear an anti-static wrist strap, or touch an unpainted metal part of the case before handling components."),
  P("SoC: two meanings","System on a Chip","In cybersecurity, SOC also means Security Operations Center, where SOC analysts work."),
  P("L1 cache","Smallest and fastest","Each CPU core usually has its own. Holds the data the CPU is using right now."),
  P("L2 cache","Middle size and speed","Each core usually has its own. Holds recently used data the CPU isn't using at the moment."),
  P("L3 cache","Largest and slowest cache","Still often about twice as fast as RAM. Usually shared by all cores."),
  P("USB 2.0: color and speed","Black port","480 Mb/s"),
  P("USB 3.0: color and speed","Blue port","5 Gb/s"),
  P("USB 3.1: color and speed","Teal port","10 Gb/s"),
  P("USB4 speed","Up to 40 Gb/s","Uses the Thunderbolt 3 protocol and USB-C cables."),
  P("How fast is USB-C?","It depends","USB-C is a connector shape. Its speed depends on the standard behind it, from 480 Mb/s up to 40 Gb/s."),
  P("CMOS vs. ROM","ROM holds the BIOS","CMOS holds the BIOS settings (date, time, boot order), kept alive by a coin battery."),
  P("RAM vs. ROM: which is volatile?","RAM is volatile","RAM loses its data when the power is off. ROM is non-volatile and keeps it."),
 ]},
{m:3,title:"Operating System",focus:"What the kernel does, file systems, process and memory management, the boot chain, shells, remote access, and virtual machines.",map:[5,6,7,8,20,23],
 cards:[
  C("Android","A mobile operating system based on Linux."),
  C("Application","A computer program designed for a specific use."),
  C("BIOS/UEFI","Low-level software that initializes the computer's hardware to make sure everything is good to go before the OS loads."),
  C("Block Storage","Stores data in blocks instead of one long piece, so it can be read and written more quickly."),
  C("Boot","To start up a computer."),
  C("Bootloader","A small program that loads the operating system."),
  C("ChromeOS","A Linux-based operating system designed by Google."),
  C("Command Line Interface (CLI)","A shell that uses text commands to interact with the operating system."),
  C("Computer File","Data that we store. A file can be anything: a Word document, a picture, a song."),
  C("Data Blocks","Data broken down into many pieces and written to different parts of the hard disk."),
  C("Distributions (Distros)","Different versions of Linux, each built on the Linux kernel with its own software and tools. Common ones: Ubuntu, Debian, and Red Hat."),
  C("Etcher","A tool (balenaEtcher, from etcher.io) that loads an install image onto a USB drive and makes it bootable."),
  C("File Extension","The end of a filename that tells us what type of file it is, like .docx, .jpg, or .mp3."),
  C("File Handling","How the OS and programs create, open, read, write, and delete files."),
  C("File System","A system used to manage files. Examples: NTFS (Windows), APFS (macOS), ext4 (Linux)."),
  C("Finder","The file manager on every Mac."),
  C("Folders/Directories","Used to organize files."),
  C("Hardware Resource Deficiency","A lack of system resources, like memory or hard drive space."),
  C("HFS+/APFS","Apple's journaling file systems. HFS+ is the older one. APFS replaced it in 2017, is built for SSDs, and has stronger built-in encryption."),
  C("Hostname","A name used to identify a computer when it talks to other computers."),
  C("Input/Output (I/O) Device","A device that performs input or output, like monitors, keyboards, mice, hard drives, speakers, Bluetooth headsets, webcams, and network adapters."),
  C("Install Image","A downloadable copy of an operating system used to install it on a device. Often an .iso file."),
  C("I/O Management","How the kernel manages communication between the computer and its input and output devices."),
  C("iOS","A mobile operating system developed by Apple."),
  C("Kernel","The core of the operating system. It talks directly to the hardware and manages processes, memory, files, and I/O."),
  C("Logs","Files that record system events on our computer."),
  C("macOS","Apple's operating system for Mac computers."),
  C("Memory Management","A kernel function that optimizes memory usage and makes sure applications have enough memory to run."),
  C("Metadata","Tells us everything about a file: who created it, when it was last modified, who has access, and what type of file it is."),
  C("Microsoft Terminal Services Client","A Windows program (mstsc.exe) used to create RDP connections to remote computers."),
  C("OpenSSH","The most popular program for using SSH on Linux."),
  C("Operating System","The whole package that manages a computer's resources and lets us interact with it."),
  C("PC","Personal computer, which technically means a computer that one person uses."),
  C("Plink (PuTTY Link)","A command-line tool that comes with PuTTY, used to make remote SSH connections."),
  C("PowerShell","A shell (a program that interprets text commands) for Windows."),
  C("Power User","An above-average computer user."),
  C("Process Management","Managing the many programs on a system: when they run, in what order, how many resources they use, and how long they run."),
  C("Qwiklabs","An online platform with hands-on labs in real cloud environments. Now part of Google Cloud Skills Boost."),
  C("Remote Connection","Lets an authorized person connect to a computer or network from somewhere else, so you can manage machines from anywhere."),
  C("Remote Desktop Protocol (RDP)","A secure protocol developed by Microsoft that lets a user connect to and control another computer's desktop remotely."),
  C("Scalability","A system's ability to increase or decrease performance and cost as processing demands change."),
  C("Shell","A program that interprets text commands and sends them to the OS to execute."),
  C("SSH (Secure Shell)","A protocol that programs use to securely access one computer from another."),
  C("SSH Authentication Key","A secure way to log in over SSH using a key pair: a public key on the server and a private key kept on your device."),
  C("SSH Client","A program you install on your device to make an SSH connection to another device."),
  C("SSH Server","Software installed on a machine that lets it accept SSH connections."),
  C("Standardization","Developing and using common technical standards for IT products, systems, and processes."),
  C("Swap Space","Space on the hard drive used as virtual memory when the physical memory (RAM) is full."),
  C("System","A group of hardware and software components that work together to run programs or processes."),
  C("System Settings","Settings like display resolution, user accounts, network, and devices."),
  C("Taskbar","Gives quick options and shows info like network connection, the date, notifications, and sound."),
  C("Terminal","A text-based interface to the computer."),
  C("Time Slice","A very short interval of time given to a process to run on the CPU."),
  C("Ubuntu","The most popular consumer Linux distribution."),
  C("Username","A unique identifier for a user account."),
  C("User Space","The part of the OS that humans interact with directly, like text editors, music players, system settings, and user interfaces."),
  C("VirtualBox","An application that runs other operating systems, like Linux, as virtual machines completely isolated from your main system."),
  C("Virtual Machine (VM)","A computer that runs as software inside your real one. It uses the physical computer's CPU, memory, and storage, so you can run several operating systems at once."),
  C("Virtual Memory","A combination of hard drive space and RAM that acts like memory our processes can use."),
  C("VPN (Virtual Private Network)","A secure way to connect a device to a private network over the internet."),
  P("Terminal vs. shell vs. CLI","Window, interpreter, method","The terminal is the window you type in. The shell interprets your commands. The CLI is the text-command way of using a computer."),
  P("Kernel vs. user space","Kernel = the core","The kernel works with the hardware behind the scenes. User space is everything you interact with directly."),
  P("SSH client vs. SSH server","Client connects, server accepts","The client is on your device. The server is on the machine you're connecting to."),
  P("RDP vs. SSH","RDP = desktop, SSH = commands","RDP shows you the remote computer's full desktop (mainly Windows). SSH gives you a secure command line (mainly Linux)."),
  P("Swap space vs. virtual memory","Swap is part of virtual memory","Virtual memory = RAM + swap. Swap is the hard-drive part used when RAM fills up."),
  P("VirtualBox vs. a VM","Software vs. the computer it runs","VirtualBox is the program. A VM is the virtual computer running inside it."),
  P("Which file system goes with which OS?","NTFS: Windows","APFS: macOS. ext4: Linux."),
  P("HFS+ vs. APFS","APFS is the newer one","APFS replaced HFS+ in 2017. It's built for SSDs and has stronger encryption."),
  P("Name 3 Linux-based operating systems","Android, ChromeOS, Ubuntu","macOS and iOS are Unix-based, but not Linux."),
  P("Startup order (full chain)","Power on → BIOS/UEFI → POST → bootloader → kernel → user space",""),
  P("Why do many programs seem to run at once?","Time slices","The CPU switches between processes so fast, giving each a tiny time slice, that they look like they run at the same time."),
 ]},
{m:4,title:"Networking",focus:"How the internet came to be, the devices that move data, IP vs MAC, DNS, TCP, NAT, and why patching matters.",map:[10,11,12,13,30,32,33],
 cards:[
  C("ARPANET","The earliest version of the internet we use today. Created in the late 1960s by DARPA, a US Department of Defense agency."),
  C("COPPA (Children's Online Privacy Protection Act)","A US law that regulates how websites and online services collect personal information from children under 13."),
  C("Client","A device that requests and receives data from a server."),
  C("DARPA","Defense Advanced Research Projects Agency. A US Department of Defense agency that, in the 1960s, created ARPANET, the earliest version of the internet."),
  C("Domain Name","A website's name, like google.com. It's the part of the URL after “www.”"),
  C("DNS (Domain Name System)","A global, highly distributed network service that turns a website name into an IP address."),
  C("Ethernet Cable","Lets you physically connect to a network through a cable."),
  C("Fiber Optic Cable","Contains glass fibers about as thin as a human hair. Instead of electrical voltages like copper, it uses pulses of light to send the 1s and 0s of data."),
  C("Globalization","The movement that lets governments, businesses, and organizations communicate and work together on an international scale."),
  C("Hub","A device that serves as a central point that data travels through. It sends data to every connected device, not just the one it's meant for."),
  C("Internet","A worldwide system of interconnected networks."),
  C("ICANN","Internet Corporation for Assigned Names and Numbers. Manages the domain name system and IP addresses worldwide. You register a website name through a registrar ICANN approves."),
  C("IoT (Internet of Things)","The idea that more and more everyday devices connect to the internet, like a smart thermostat that turns off the AC when you leave and back on when you return."),
  C("IPv4","An IP address made of 32 bits, split into four groups of 8, like 192.168.1.1. That allows about 4.3 billion addresses."),
  C("IPv6","An IP address made of 128 bits, four times as many bits as IPv4. Written as eight groups of hexadecimal, it allows vastly more addresses."),
  C("ISP (Internet Service Provider)","A company that provides internet connections to customers."),
  C("IP Address","A numerical label assigned to each device on a network that uses the Internet Protocol to communicate."),
  C("MAC Address","A globally unique, 48-bit identifier attached to a network interface. Written as six groups of two hexadecimal numbers."),
  C("Network","Computers and devices connected so they can communicate."),
  C("NAT (Network Address Translation)","Lets an organization use one public IP address for many private IP addresses inside its network. It helps with the shortage of IPv4 addresses."),
  C("Networking","Managing, building, and designing networks."),
  C("Networking Protocols","A set of rules for how data is transferred over a network."),
  C("Network Stack","The layers of protocols and software (like the TCP/IP model) that work together to send and receive data over a network."),
  C("Router","A device that knows how to forward data between independent networks."),
  C("Server Logs","Text files that record the activity on a specific web server over a period of time."),
  C("Server","A device that provides data to other devices, called clients, that request it."),
  C("Switch","A device that connects devices on the same network and sends data only to the device it's meant for, using MAC addresses."),
  C("TCP (Transmission Control Protocol)","Handles reliable delivery of data. It makes sure data arrives complete and in order, and resends anything that gets lost."),
  C("URL (Uniform Resource Locator)","A web address, similar to a home address. Example: https://www.google.com"),
  C("WannaCry Attack","A 2017 ransomware attack that hit Europe hard first and infected hundreds of thousands of computers worldwide. It spread through unpatched Windows machines."),
  C("Wi-Fi (Wireless Networking)","Networks you connect to through radio waves and antennas instead of cables."),
  C("World Wide Web (WWW)","The information system that lets web pages and other resources be accessed over the internet."),
  P("Internet vs. World Wide Web","Roads vs. what's on them","The internet is the network of networks. The web is one service that runs on it, alongside email, streaming, and more."),
  P("Hub vs. switch vs. router","Hub: sends to everyone","Switch: sends to the right device on your network. Router: sends data between different networks."),
  P("IP address vs. MAC address","IP can change, MAC stays","An IP address is assigned by the network. A MAC address is built into the network hardware."),
  P("What does DNS do when you type a URL?","Name → IP address","DNS looks up the website name and returns its IP address so your computer can connect."),

/* ====================================================================
   STATE
==================================================================== */
const LS="soc_examgrade_v3";
function freshState(){return{startISO:null,cursor:0,completed:{},lastDoneISO:null,streak:0,tier2Unlocked:{},quizProg:{},taskProg:{},pace:"thorough",mistakes:[],fcShaky:{},portsBest:0,warmup:null,explainNeeds:{},gitBest:{},gShaky:{},binBest:0};}
let S=loadState();
function loadState(){try{const x=JSON.parse(localStorage.getItem(LS));if(x)return Object.assign(freshState(),x);}catch(e){}return freshState();}
function saveState(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function todayISO(){return new Date().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function isRestDay(d){return d===5||d===6;}

function reqCounts(L){
  const p=PACE[S.pace];
  return{terms:Math.min(p.terms,L.terms.length),quiz:Math.min(p.quiz,L.quiz.length)};
}
function weekAccuracy(cert,week){
  const ls=CURRICULUM.map((l,i)=>({l,i})).filter(x=>x.l.cert===cert&&x.l.week===week);
  let ok=0,total=0,allDone=true;
  ls.forEach(x=>{const c=S.completed[x.i];if(c){ok+=c.ok;total+=c.total;}else allDone=false;});
  return{ok,total,pct:total?Math.round(ok/total*100):0,allDone};
}
function overallStats(){let done=0,ok=0,total=0;Object.values(S.completed).forEach(c=>{done++;ok+=c.ok;total+=c.total;});return{done,total:CURRICULUM.length,acc:total?Math.round(ok/total*100):0};}
function missedDayPending(){
  if(!S.startISO)return false;
  const start=new Date(S.startISO+"T00:00:00"),now=new Date(todayISO()+"T00:00:00");
  let sd=0;for(let d=new Date(start);d<=now;d.setDate(d.getDate()+1)){if(!isRestDay(d.getDay()))sd++;}
  return sd>Object.keys(S.completed).length;
}

/* ====================================================================
   RENDER
==================================================================== */
const stage=document.getElementById('stage');
let mode="today";
let viewIdx=null; // null = live current day; a number = read-only review of that completed/past day
let weekView=null; // null = current week; a number = index of any lesson in the week being browsed

function renderPace(){
  document.querySelectorAll('.pace-opt').forEach(b=>{
    b.classList.toggle('active',b.dataset.pace===S.pace);
    b.onclick=()=>{S.pace=b.dataset.pace;saveState();render();};
  });
  document.getElementById('paceMeta').textContent=PACE[S.pace].label;
}
function renderStatus(){
  const o=overallStats();
  document.getElementById('status').innerHTML=`
    <div class="stat"><div class="v">${o.done}/${o.total}</div><div class="l">Days done</div></div>
    <div class="stat streak"><div class="v">${S.streak}🔥</div><div class="l">Streak</div></div>
    <div class="stat"><div class="v">${o.acc}%</div><div class="l">Accuracy</div></div>
    <div class="stat tier"><div class="v">${S.mistakes?S.mistakes.length:0}</div><div class="l">To review</div></div>`;
}
document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;viewIdx=null;weekView=null;if(mode==="google"){gv=null;gq=null;}document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));render();});

function render(){renderPace();renderStatus();
  if(mode==="today")renderToday();else if(mode==="review")renderReview();else if(mode==="week")renderWeek();else if(mode==="vm")renderVM();else if(mode==="playbook")renderPlaybook();else if(mode==="practice")renderPractice();else if(mode==="deep")renderDeep();else if(mode==="google")renderGoogle();else renderExport();}

/* -------- READ-ONLY PAST-DAY VIEW (no progress mutation) -------- */
function renderDayView(idx){
  const L=CURRICULUM[idx],wkey=L.cert+"|"+L.week;
  const c=S.completed[idx];
  const tier2on=S.tier2Unlocked[wkey];
  const req=reqCounts(L);
  let terms=L.terms.slice(0,req.terms);
  if(tier2on)terms=[...terms,...(TIER2[wkey]||[])];
  const quizSet=L.quiz.slice(0,req.quiz);
  const stage=document.getElementById('stage');
  stage.innerHTML=`
    <button class="btn ghost" id="backToCurrent" style="margin-bottom:14px">← back to current day (Day ${CURRICULUM[Math.min(S.cursor,CURRICULUM.length-1)].day})</button>
    <div class="banner info"><span class="ic">👁</span><div><b>Reviewing Day ${L.day}.</b> ${c?`You completed this — scored <b>${Math.round(c.ok/c.total*100)}%</b>${c.doneISO?` on ${c.doneISO}`:''}.`:'Read-only view.'} Nothing here changes your progress or streak.</div></div>
    <div class="lesson-head">
      <span class="pill cert">${L.cert}</span>
      <span class="pill wk">W${L.week} · D${L.day}</span>

    <div class="sec-label">VOCABULARY &amp; TERMS <span class="sec-count">${terms.length} terms</span></div>
    <div id="terms">${terms.map(tm=>{
      const conn=tm.t.includes("◆CONNECTOR");
      const nm=tm.t.replace("◆CONNECTOR","").trim();
      return `<div class="term">
        <div class="t">${nm} ${conn?'<span class="new" style="background:#0d1f15;color:var(--green);border-color:#1d4427">◆ CONNECTOR</span>':''} ${tm.t2?'<span class="new">NEW TIER</span>':''}</div>
        <div class="d">${tm.d}</div>
        <div class="eli5"><b>LIKE YOU'RE NEW ▸</b> ${tm.e}</div>
        ${tm.exam?`<div class="exam">▸ EXAM: ${tm.exam}</div>`:''}
      </div>`;}).join('')}
    </div>

    <div class="sec-label">PRACTICE TASKS <span class="sec-count">${L.tasks.length} tasks</span></div>
    <div id="tasks">${L.tasks.map(tk=>`<div class="task"><div class="cb"></div><div class="tx">${tk}</div></div>`).join('')}</div>

    <div class="sec-label">KNOWLEDGE CHECK — answers shown <span class="sec-count">${quizSet.length} questions</span></div>
    <div id="quizreview">${quizSet.map((it,qi)=>`
      <div class="explain show" style="border-left-color:var(--blue);margin-bottom:6px">
        <div class="q-obj">▸ ${it.obj}</div>
        <div class="quiz-stem" style="margin:6px 0">Q${qi+1}. ${it.s}</div>
        ${it.o.map((o,i)=>`<div style="padding:3px 0;color:${i===it.a?'var(--green)':'var(--muted)'}">${String.fromCharCode(65+i)}. ${o} ${i===it.a?'✓':''}</div>`).join('')}
        <div style="margin-top:6px;border-left:2px solid var(--green);padding-left:8px"><b style="color:var(--green)">Why ${String.fromCharCode(65+it.a)} is correct:</b> ${it.e}</div>
      </div>`).join('')}
    </div>
    <button class="btn primary" id="backToCurrent2" style="margin-top:16px">← back to current day</button>`;
  document.getElementById('backToCurrent').onclick=document.getElementById('backToCurrent2').onclick=()=>{viewIdx=null;render();};
}

/* -------- DAILY WARM-UP (3 review questions before the new lesson) -------- */
function ensureWarmup(){
  if(S.cursor===0)return null;
  const today=todayISO();
  if(!S.warmup||S.warmup.date!==today||!Array.isArray(S.warmup.qs)){
    const pool=[];
    for(let li=0;li<S.cursor&&li<CURRICULUM.length;li++)CURRICULUM[li].quiz.forEach((q,qi)=>pool.push({li,qi}));
    if(pool.length<3)return null;
    S.warmup={date:today,qs:shuffle(pool).slice(0,3),i:0,ok:0,picked:null};
    saveState();
  }
  return S.warmup;
}
function warmupHTML(){
  const w=ensureWarmup();if(!w)return "";
  if(w.i>=w.qs.length){
    return `<div class="banner ok" style="margin-bottom:14px"><span class="ic">☀</span><div><b>Warm-up done: ${w.ok}/${w.qs.length}.</b> Old material stays sharp through daily reps. On to today's lesson.</div></div>`;
  }
  const ref=w.qs[w.i],src=CURRICULUM[ref.li],q=src.quiz[ref.qi];
  let opts=q.o.map((o,i)=>{
    let cls="opt";
    if(w.picked!==null){if(i===q.a)cls+=" correct";else if(i===w.picked)cls+=" wrong";}
    return `<button class="${cls}" data-wu="${i}" ${w.picked!==null?'disabled':''}><span class="ltr">${String.fromCharCode(65+i)}</span>${o}</button>`;
  }).join('');
  let fb="";
  if(w.picked!==null){
    const right=w.picked===q.a;
    const ww=(!right&&q.w&&q.w[w.picked])?`<div style="margin-top:6px;border-left:2px solid var(--red);padding-left:8px"><b style="color:var(--red)">Why ${String.fromCharCode(65+w.picked)} is wrong:</b> ${q.w[w.picked]}</div>`:"";
    fb=`${ww}<div style="margin-top:6px;border-left:2px solid var(--green);padding-left:8px"><b style="color:var(--green)">Why ${String.fromCharCode(65+q.a)} is correct:</b> ${q.e}</div>
        <button class="btn ghost" id="wuNext" style="width:100%;margin-top:10px">${w.i>=w.qs.length-1?'finish warm-up ✓':'next warm-up question →'}</button>`;
  }
  return `<div class="term" style="border-color:#2a3a20" id="wublock">
    <div class="t">☀ DAILY WARM-UP <span class="sec-count" style="float:right">${w.i+1}/${w.qs.length} · from ${src.cert} W${src.week}D${src.day}</span></div>
    <div class="quiz-stem" style="margin-top:8px">${q.s}</div>
    <div>${opts}</div>${fb}
  </div>`;
}
function wireWarmup(){
  const w=S.warmup;if(!w)return;
  stage.querySelectorAll('[data-wu]').forEach(b=>b.onclick=()=>{
    if(w.picked!==null)return;
    w.picked=+b.dataset.wu;
    const ref=w.qs[w.i],q=CURRICULUM[ref.li].quiz[ref.qi];
    if(w.picked===q.a)w.ok++;
    saveState();render();
  });
  const nx=document.getElementById('wuNext');
  if(nx)nx.onclick=()=>{w.i++;w.picked=null;saveState();render();};
}

/* -------- TODAY -------- */
function renderToday(){
  if(viewIdx!==null&&viewIdx!==S.cursor){renderDayView(viewIdx);return;}
  if(S.cursor>=CURRICULUM.length){
    stage.innerHTML=`<div class="done-screen"><div class="big">★ SLICE COMPLETE</div>
      <p>You finished the loaded curriculum. The engine's ready for the next batch of weeks to be added.</p></div>`;return;
  }
  const idx=S.cursor,L=CURRICULUM[idx],wkey=L.cert+"|"+L.week;
  const req=reqCounts(L);
  const tier2on=S.tier2Unlocked[wkey];
  let terms=L.terms.slice(0,req.terms);
  if(tier2on)terms=[...terms,...(TIER2[wkey]||[])];
  const quizSet=L.quiz.slice(0,req.quiz);

  let banners="";
  if(missedDayPending())
    banners+=`<div class="banner catch"><span class="ic">⚠</span><div><b>Catch-up mode.</b> A study day passed without a completed lesson. No skipping — finish this day to close the gap. Each completed day advances you one slot, so you catch up by doing the work.</div></div>`;
  if(L.title.includes("checkpoint"))
    banners+=`<div class="banner warn"><span class="ic">◆</span><div><b>Weekly checkpoint.</b> Score <b>85%+</b> across the week to unlock Tier-2 vocab for ${L.cert} Week ${L.week} — advanced terms layered on so you keep growing.</div></div>`;
  if(tier2on)
    banners+=`<div class="banner up"><span class="ic">↑</span><div><b>Tier-2 active</b> for ${L.cert} W${L.week}. Advanced terms are mixed in below (<span style="color:var(--purple)">NEW TIER</span>).</div></div>`;
  banners+=`<div class="banner info"><span class="ic">▣</span><div><b>${S.pace.toUpperCase()} pace:</b> ${req.terms} terms + ${quizSet.length} exam questions required today. Switch pace up top anytime — FASTER trims to essentials, THOROUGH loads everything.</div></div>`;

  stage.innerHTML=warmupHTML()+banners+`
    <div class="lesson-head">
      <span class="pill cert">${L.cert}</span>
      <span class="pill wk">W${L.week} · D${L.day}</span>
      <span class="pill obj">${L.obj}</span>
      ${tier2on?'<span class="pill tierp">TIER 2</span>':''}
    </div>
    <div class="lesson-title">${L.title}</div>
    <div class="lesson-focus">${L.focus}</div>
    <div class="est">⏱ est. ${PACE[S.pace].estLo}–${PACE[S.pace].estHi} min at ${S.pace} pace</div>

    <div class="sec-label">VOCABULARY &amp; TERMS <span class="sec-count">${terms.length} terms</span></div>
    <div id="terms">${terms.map(tm=>{
      const conn=tm.t.includes("◆CONNECTOR");
      const nm=tm.t.replace("◆CONNECTOR","").trim();
      return `<div class="term">
        <div class="t">${nm} ${conn?'<span class="new" style="background:#0d1f15;color:var(--green);border-color:#1d4427">◆ CONNECTOR</span>':''} ${tm.t2?'<span class="new">NEW TIER</span>':''}</div>
        <div class="d">${tm.d}</div>
        <div class="eli5"><b>LIKE YOU'RE NEW ▸</b> ${tm.e}</div>
        ${tm.exam?`<div class="exam">▸ EXAM: ${tm.exam}</div>`:''}
      </div>`;}).join('')}
    </div>

    <div class="sec-label">PRACTICE TASKS <span class="sec-count">${L.tasks.length} tasks</span></div>
    <div id="tasks">${L.tasks.map((tk,i)=>`
      <div class="task" data-ti="${i}"><div class="cb" data-ti="${i}"></div><div class="tx">${tk}</div></div>`).join('')}
    </div>

    <div class="sec-label">KNOWLEDGE CHECK <span class="sec-count">${quizSet.length} questions</span></div>
    <div id="quizarea"></div>`;

  wireWarmup();
  const taskState=new Array(L.tasks.length).fill(false);
  stage.querySelectorAll('.cb').forEach(cb=>cb.onclick=()=>{
    const i=+cb.dataset.ti;taskState[i]=!taskState[i];
    cb.classList.toggle('checked',taskState[i]);cb.closest('.task').classList.toggle('checked',taskState[i]);
    enableFinish();
  });

  const PASS_PCT=85;
  function renderQuizArea(){
    const area=document.getElementById('quizarea');
    const qp=S.quizProg[idx]||{i:0,ok:0};
    if(qp.i>=quizSet.length){
      const pct=Math.round(qp.ok/Math.max(quizSet.length,1)*100);
      const passed=pct>=PASS_PCT;
      if(passed){
        area.innerHTML=`<div class="scorebar"><span>Quiz complete:</span><span class="ok">✓ ${qp.ok}</span><span class="no">✗ ${quizSet.length-qp.ok}</span><span>· ${pct}%</span></div>
          <div class="banner ok"><span class="ic">✓</span><div><b>Passed at ${pct}%.</b> You cleared the 85% bar for Day ${L.day}. Finish your practice tasks above, then complete the day.</div></div>
          <button class="btn primary" id="finishBtn" disabled>Finish tasks + quiz to advance</button>`;
        wireFinish();enableFinish();
      }else{
        area.innerHTML=`<div class="scorebar"><span>Quiz score:</span><span class="ok">✓ ${qp.ok}</span><span class="no">✗ ${quizSet.length-qp.ok}</span><span>· ${pct}%</span></div>
          <div class="banner warn"><span class="ic">◆</span><div><b>${pct}% — not quite there.</b> You need <b>85%+</b> to lock in Day ${L.day} with confidence. Your missed questions are saved to Review. Re-read the explanations above, then take another run.</div></div>
          <button class="btn primary" id="retryBtn">↻ Try the quiz again</button>
          <div class="mini" style="margin-top:8px">Tip: jump to <b>Review</b> mode first to drill exactly what you missed, then come back and retake.</div>`;
        document.getElementById('retryBtn').onclick=()=>{
          S.quizProg[idx]={i:0,ok:0};saveState();renderQuizArea();
        };
      }
      return;
    }
    const it=quizSet[qp.i];
    area.innerHTML=`
      <div class="scorebar"><span>Q ${qp.i+1}/${quizSet.length}</span><span class="ok">✓ ${qp.ok}</span></div>
      <div class="q-obj">▸ ${it.obj}</div>
      <div class="quiz-stem">${it.s}</div>
      <div id="opts">${it.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>
      <div class="explain" id="expwrong" style="border-left-color:var(--red);display:none"></div>
      <div class="explain" id="exp"><b>Why ${String.fromCharCode(65+it.a)} is correct:</b> ${it.e}</div>
      <button class="btn ghost" id="nextq" style="display:none">next question →</button>`;
    let answered=false;
    area.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      if(answered)return;answered=true;
      const pick=+btn.dataset.i;
      area.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===it.a)b.classList.add('correct');});
      if(pick===it.a)qp.ok++;else{btn.classList.add('wrong');
        // show why THIS pick was wrong
        const ww=(it.w&&it.w[pick])?it.w[pick]:"That option doesn't fit — re-read the correct answer's explanation below.";
        const ew=document.getElementById('expwrong');
        ew.innerHTML=`<b style="color:var(--red)">Why ${String.fromCharCode(65+pick)} is wrong:</b> ${ww}`;
        ew.style.display='block';
        // record mistake for review (dedupe by stem), now WITH wrongWhy
        if(!S.mistakes.some(m=>m.s===it.s)){S.mistakes.push({s:it.s,o:it.o,a:it.a,e:it.e,w:it.w||{},obj:it.obj,cert:L.cert,day:L.day,week:L.week});}
      }
      document.getElementById('exp').classList.add('show');

function weekTerms(cert,week){
  let t=[];CURRICULUM.filter(l=>l.cert===cert&&l.week===week).forEach(l=>t=t.concat(l.terms));
  const k=cert+"|"+week;if(S.tier2Unlocked[k]&&typeof TIER2!=='undefined'&&TIER2[k])t=t.concat(TIER2[k]);
  return t.map(x=>({name:x.t.replace("◆CONNECTOR","").trim(),def:x.d,eli5:x.e}));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(cert,week){
  const t=weekTerms(cert,week),sh=S.fcShaky||{};let d=[];
  t.forEach(x=>{d.push(x);if(sh[x.name])d.push(x);}); // shaky cards appear twice
  return shuffle(d);
}

/* -------- SUBNETTING DRILL (infinite generated problems) -------- */
let snQ=null;
function snInfo(c){const hostBits=32-c,total=2**hostBits;return{hostBits,total,usable:total-2,maskEnd:256-total,block:total};}
function newSubnetQ(){
  const r=n=>Math.floor(Math.random()*n);
  const cidrs=[25,26,27,28,29,30];
  const c=cidrs[r(cidrs.length)],inf=snInfo(c);
  const base=`192.168.${1+r(20)}`;
  const h=1+r(254);
  const net=Math.floor(h/inf.block)*inf.block, bc=net+inf.block-1;
  const type=r(5);
  const uniq=a=>[...new Set(a)];
  let q;
  if(type===0){ // usable hosts
    const opts=uniq([inf.usable,inf.total,snInfo(c-1).usable,snInfo(Math.min(c+1,30)).usable,14,6].filter(x=>x>0)).slice(0,4);
    q={s:`How many USABLE hosts does a /${c} subnet provide?`,o:shuffle(opts.map(String)),a:String(inf.usable),
       e:`/${c} leaves ${inf.hostBits} host bits → 2^${inf.hostBits} = ${inf.total} total addresses, minus 2 (network + broadcast) = <b>${inf.usable} usable</b>.`};
  }else if(type===1){ // network address
    const opts=uniq([`${base}.${net}`,`${base}.${bc}`,`${base}.${Math.max(net-inf.block,0)}`,`${base}.${Math.min(net+inf.block,256-inf.block)}`]).slice(0,4);
    q={s:`What is the NETWORK address for ${base}.${h}/${c}?`,o:shuffle(opts),a:`${base}.${net}`,
       e:`Magic number: 256 − ${inf.maskEnd} = <b>${inf.block}</b>. Blocks start every ${inf.block}: host .${h} falls in the block starting at <b>.${net}</b> — that's the network address. (Broadcast is .${bc}.)`};
  }else if(type===2){ // broadcast
    const opts=uniq([`${base}.${bc}`,`${base}.${net}`,`${base}.${Math.min(bc+inf.block,255)}`,`${base}.${net+1}`]).slice(0,4);
    q={s:`What is the BROADCAST address for ${base}.${h}/${c}?`,o:shuffle(opts),a:`${base}.${bc}`,
       e:`Block size ${inf.block} → this block runs .${net} to .${bc}. The LAST address in the block, <b>.${bc}</b>, is the broadcast. Usable hosts are .${net+1}–.${bc-1}.`};
  }else if(type===3){ // same subnet?
    const h2=1+r(254);
    const net2=Math.floor(h2/inf.block)*inf.block, same=net2===net;
    q={s:`Are ${base}.${h}/${c} and ${base}.${h2}/${c} in the SAME subnet?`,o:["Yes — same subnet","No — different subnets"],a:same?"Yes — same subnet":"No — different subnets",
       e:`Block size ${inf.block}. Host .${h} is in the .${net} block (${net}–${bc}); host .${h2} is in the .${net2} block (${net2}–${net2+inf.block-1}). ${same?'Same block → <b>same subnet</b> — they can talk directly.':'Different blocks → <b>different subnets</b> — traffic between them must go through the router.'}`};
  }else{ // smallest prefix for N hosts
    const needs=[2,6,14,25,30,50,60,100,120];const n=needs[r(needs.length)];
    let ans=30;for(let cc=30;cc>=24;cc--){if(snInfo(cc).usable>=n){ans=cc;break;}}
    const opts=uniq(["/"+ans,"/"+(ans-1),"/"+(ans+1),"/"+(ans-2)].filter(x=>{const v=+x.slice(1);return v>=24&&v<=30;})).slice(0,4);
    q={s:`What's the SMALLEST subnet (largest /prefix) that supports at least ${n} usable hosts?`,o:shuffle(opts),a:"/"+ans,
       e:`Need 2^h − 2 ≥ ${n}. /${ans} gives ${snInfo(ans).usable} usable ✓ while /${ans+1<=30?ans+1:30} gives only ${snInfo(Math.min(ans+1,30)).usable} ✗. Prefix = 32 − ${32-ans} host bits = <b>/${ans}</b>.`};
  }
  snQ=Object.assign(q,{picked:null});
  if(window.__snScore===undefined)window.__snScore={ok:0,tot:0};
}
function renderSubnetDrill(){
  const sc=window.__snScore||{ok:0,tot:0};
  stage.innerHTML=`
    <button class="btn ghost" id="prBack" style="margin-bottom:10px">← practice menu</button>
    <div class="scorebar"><span>Subnet drill</span><span class="ok">✓ ${sc.ok}</span><span>· ${sc.tot} attempted</span></div>
    <div class="quiz-stem">${snQ.s}</div>
    <div id="opts">${snQ.o.map((o,i)=>{
      let cls="opt";if(snQ.picked!==null){if(o===snQ.a)cls+=" correct";else if(i===snQ.picked)cls+=" wrong";}
      return `<button class="${cls}" data-i="${i}" ${snQ.picked!==null?'disabled':''}><span class="ltr">${String.fromCharCode(65+i)}</span>${o}</button>`;}).join('')}</div>
    ${snQ.picked!==null?`<div class="explain show"><b>How to work it:</b> ${snQ.e}</div>
      <button class="btn primary" id="snNext" style="width:100%;margin-top:10px">next problem →</button>`:''}
    <div class="mini" style="margin-top:10px">Stuck? The <b>DEEP DIVE → Subnetting</b> section teaches the magic-number method these explanations use.</div>`;
  document.getElementById('prBack').onclick=()=>{prGame=null;render();};
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(snQ.picked!==null)return;
    snQ.picked=+b.dataset.i;
    window.__snScore.tot++;if(snQ.o[snQ.picked]===snQ.a)window.__snScore.ok++;
    render();
  });
  const nx=document.getElementById('snNext');if(nx)nx.onclick=()=>{newSubnetQ();render();};
}

 {id:"nat",topic:"NAT",prompt:"A friend asks: \"if my laptop's IP is 192.168.1.50 and my roommate's laptop is ALSO 192.168-something at their mom's house, how does the internet not get confused?\"",

function gBuildDeck(m,kind){
  const md=gMod(m),sh=S.gShaky||{};let d=[];

function toBin(n){return n.toString(2).padStart(8,'0');}
function binBreak(n){const pv=[128,64,32,16,8,4,2,1],b=toBin(n);const on=pv.filter((v,i)=>b[i]==='1');
  return `<div style="font-family:var(--mono);font-size:12px;margin-top:8px;overflow-x:auto"><table style="border-collapse:collapse">
    <tr>${pv.map(v=>`<td style="padding:2px 6px;color:var(--muted);text-align:center">${v}</td>`).join('')}</tr>
    <tr>${b.split('').map(c=>`<td style="padding:2px 6px;text-align:center;color:${c==='1'?'var(--green)':'var(--muted)'};font-weight:${c==='1'?700:400}">${c}</td>`).join('')}</tr></table>
    <div style="margin-top:6px">${on.length?on.join(' + '):'0'} = <b style="color:var(--amber)">${n}</b></div></div>`;}
function newBinQ(){
  const n=Math.floor(Math.random()*256),dir=Math.random()<.5?'d2b':'b2d';
  const set=new Set([n]);
  while(set.size<4){ // near-miss distractors: flip one bit, or ±small offsets
    const r=Math.random();let x=r<.7?n^(1<<Math.floor(Math.random()*8)):n+[-2,-1,1,2,16,-16][Math.floor(Math.random()*6)];
    if(x>=0&&x<=255)set.add(x);
  }
  const opts=shuffle([...set]);
  gBin=Object.assign(gBin||{streak:0},{n,dir,opts,a:opts.indexOf(n)});
}
function renderGBinary(){
  const q=gBin;
  stage.innerHTML=`
    <button class="btn ghost" id="gBack" style="margin-bottom:10px">← Google IT menu</button>
    <div class="scorebar"><span>Streak: <b class="ok" id="binStreak">${q.streak}</b></span><span>Best: <span id="binBestV">${S.binBest||0}</span></span><span>Place values: 128 64 32 16 8 4 2 1</span></div>
    <div class="q-obj">▸ M1 · ${q.dir==='d2b'?'decimal → binary':'binary → decimal'}</div>
    <div class="quiz-stem" style="font-family:var(--mono);font-size:22px">${q.dir==='d2b'?q.n:toBin(q.n)}</div>
    <div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" style="font-family:var(--mono)"><span class="ltr">${String.fromCharCode(65+i)}</span>${q.dir==='d2b'?toBin(o):o}</button>`).join('')}</div>

    if(ok){q.streak++;if(q.streak>(S.binBest||0)){S.binBest=q.streak;saveState();}}else{btn.classList.add('wrong');q.streak=0;}
    document.getElementById('binStreak').textContent=q.streak;document.getElementById('binBestV').textContent=S.binBest||0;
    const ex=document.getElementById('exp');
    ex.innerHTML=`<b>${ok?'Correct.':'Not quite. Streak reset.'}</b> Here's the breakdown:${binBreak(q.n)}${!ok?`<div style="margin-top:8px;color:var(--muted)">You picked ${q.dir==='d2b'?toBin(q.opts[pick]):q.opts[pick]}, which is ${q.dir==='d2b'?q.opts[pick]:toBin(q.opts[pick])}.</div>`:''}`;
    ex.classList.add('show');document.getElementById('nextq').style.display='block';

let exQ=null;
function newExplainQ(){
  const needs=S.explainNeeds||{};
  const flagged=EXPLAIN.filter(e=>needs[e.id]);
  const rest=shuffle(EXPLAIN.filter(e=>!needs[e.id]));
  const order=[...shuffle(flagged),...rest];
  if(!window.__exSeen)window.__exSeen=[];
  const next=order.find(e=>!window.__exSeen.includes(e.id))||order[0];
  exQ={item:next,revealed:false};
}
function renderExplain(){
  const e=exQ.item;
  const flagged=(S.explainNeeds||{})[e.id];
  stage.innerHTML=`
    <button class="btn ghost" id="prBack" style="margin-bottom:10px">← practice menu</button>
    <div class="scorebar"><span>Explain it back</span><span>${e.topic}${flagged?' · <span style="color:var(--amber)">↻ needs work</span>':''}</span></div>
    <div class="banner info"><span class="ic">🗣</span><div><b>Say it OUT LOUD before revealing.</b> If you can teach it, you own it — and this doubles as interview practice.</div></div>
    <div class="quiz-stem">${e.prompt}</div>
    ${exQ.revealed?`
      <div class="explain show"><b>Key points to have hit:</b><ul class="pb-list">${e.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>
      <div class="explain show" style="border-left-color:var(--green)"><b style="color:var(--green)">Model answer, out loud:</b> <i>${e.say}</i></div>
      <div class="backup-row">
        <button class="backup-btn" id="exGot" style="border-color:#1d4427;color:var(--green)">✓ nailed it</button>
        <button class="backup-btn" id="exNeeds" style="border-color:#4a3a10;color:var(--amber)">↻ needs work</button>
      </div>`
    :`<button class="btn primary" id="exReveal" style="width:100%;margin-top:12px">reveal model answer</button>`}
    <div class="mini" style="margin-top:10px">\"Needs work\" prompts come back first next session. ${Object.keys(S.explainNeeds||{}).length?`Currently flagged: ${Object.keys(S.explainNeeds).length}.`:''}</div>`;
  document.getElementById('prBack').onclick=()=>{prGame=null;render();};
  const rv=document.getElementById('exReveal');if(rv)rv.onclick=()=>{exQ.revealed=true;render();};
  const g=document.getElementById('exGot'),n=document.getElementById('exNeeds');
  const advance=()=>{window.__exSeen=window.__exSeen||[];window.__exSeen.push(e.id);if(window.__exSeen.length>=EXPLAIN.length)window.__exSeen=[];newExplainQ();render();};
  if(g)g.onclick=()=>{S.explainNeeds=S.explainNeeds||{};delete S.explainNeeds[e.id];saveState();advance();};
  if(n)n.onclick=()=>{S.explainNeeds=S.explainNeeds||{};S.explainNeeds[e.id]=(S.explainNeeds[e.id]||0)+1;saveState();advance();};
}

/* -------- PORTS SPEED-DRILL -------- */
const PORTS=[[20,"FTP (data)"],[21,"FTP (control)"],[22,"SSH / SFTP"],[23,"Telnet"],[25,"SMTP"],[53,"DNS"],[67,"DHCP (server)"],[68,"DHCP (client)"],[80,"HTTP"],[110,"POP3"],[123,"NTP"],[143,"IMAP"],[161,"SNMP"],[389,"LDAP"],[443,"HTTPS"],[445,"SMB"],[587,"SMTP (secure submission)"],[993,"IMAPS"],[995,"POP3S"],[3389,"RDP"]];
let ptQ=null;
function newPortQ(){
  const r=n=>Math.floor(Math.random()*n);
  const pick=PORTS[r(PORTS.length)];
  const askPort=Math.random()<.5; // true: show service, pick port
  let distract=shuffle(PORTS.filter(p=>p[0]!==pick[0])).slice(0,3);
  const opts=shuffle([pick,...distract]);
  ptQ={askPort,pick,opts,picked:null};
}
function renderPortsDrill(){
  const st=window.__portStreak||0;
  stage.innerHTML=`
    <button class="btn ghost" id="prBack" style="margin-bottom:10px">← practice menu</button>

    ${ptQ.picked!==null?`<div class="explain show"><b>${ptQ.pick[1]} = port ${ptQ.pick[0]}.</b> ${ptQ.opts[ptQ.picked][0]===ptQ.pick[0]?'Locked in.':'Streak reset — every rep still counts.'}</div>

  document.getElementById('prBack').onclick=()=>{prGame=null;render();};
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(ptQ.picked!==null)return;
    ptQ.picked=+b.dataset.i;

function renderReview(){
  if(!S.mistakes.length){
    stage.innerHTML=`<div class="vm-lock"><div class="lk">🎯</div><div class="mono">No mistakes logged yet.</div>
      <p style="margin-top:10px;font-size:13px;color:var(--muted)">When you miss a question in TODAY, it lands here so you can re-drill it. Repetition on your weak spots is how this sticks.</p></div>`;
    return;
  }
  // a review session: re-ask each missed question; correct twice in a row removes it
  const rp=window.__reviewPos||0;
  const list=S.mistakes;
  if(rp>=list.length){
    window.__reviewPos=0;
    stage.innerHTML=`<div class="done-screen"><div class="big">↻ Round done</div>
      <p>You re-drilled all ${list.length} missed question${list.length>1?'s':''}. ${list.length} still in rotation.</p>
      <button class="btn primary" id="again">drill again →</button>
      <button class="btn ghost" id="clearOne">remove ones I now know</button></div>`;
    document.getElementById('again').onclick=()=>{window.__reviewPos=0;renderReview();};
    document.getElementById('clearOne').onclick=()=>{
      // remove any marked mastered
      S.mistakes=S.mistakes.filter(m=>!m._mastered);saveState();window.__reviewPos=0;renderReview();
    };
    return;
  }
  const it=list[rp];
  stage.innerHTML=`
    <div class="banner info"><span class="ic">🎯</span><div><b>Review mode.</b> Re-drilling your missed questions (${rp+1} of ${list.length}). Get it right and mark it mastered to clear it out.</div></div>
    <div class="lesson-head"><span class="pill cert">${it.cert}</span><span class="pill wk">${it.cert==="G-IT"?`${it.week} · ${it.day}`:`W${it.week} · D${it.day}`}</span><span class="pill obj">${it.obj}</span></div>
    <div class="q-obj" style="margin-top:10px">▸ ${it.obj}</div>
    <div class="quiz-stem">${it.s}</div>
    <div id="opts">${it.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>
    <div class="explain" id="expwrong" style="border-left-color:var(--red);display:none"></div>
    <div class="explain" id="exp"><b>Why ${String.fromCharCode(65+it.a)} is correct:</b> ${it.e}</div>
    <div id="revnav" style="display:none;margin-top:14px">
      <button class="btn primary" id="masterBtn">✓ Got it — mark mastered &amp; next</button>
      <button class="btn ghost" id="keepBtn">keep in rotation → next</button>
    </div>`;
  let answered=false;
  stage.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    if(answered)return;answered=true;
    const pick=+btn.dataset.i;
    stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===it.a)b.classList.add('correct');});
    if(pick!==it.a){btn.classList.add('wrong');
      const ww=(it.w&&it.w[pick])?it.w[pick]:"That option doesn't fit — re-read the correct answer's explanation below.";
      const ew=document.getElementById('expwrong');
      ew.innerHTML=`<b style="color:var(--red)">Why ${String.fromCharCode(65+pick)} is wrong:</b> ${ww}`;
      ew.style.display='block';
    }
    document.getElementById('exp').classList.add('show');
    document.getElementById('revnav').style.display='block';
    const correct=pick===it.a;
    document.getElementById('masterBtn').onclick=()=>{it._mastered=true;S.mistakes=S.mistakes.filter(m=>m.s!==it.s);saveState();renderReview();};
    document.getElementById('keepBtn').onclick=()=>{window.__reviewPos=rp+1;renderReview();};
  });
}

      q.o.forEach((opt,oi)=>{const c=oi===q.a;
        body+=`<p style="margin:0 0 0 24pt;color:${c?'#2d6a3e':'#000'}"><b>${L[oi]}.</b> ${c?'<b>':''}${esc(opt)}${c?' ✓</b>':''}</p>`;});
      body+=`<p style="margin:2pt 0 2pt 24pt;border-left:3px solid #2d6a3e;padding-left:8pt"><b style="color:#2d6a3e">Why ${L[q.a]} is correct:</b> <i>${esc(q.e)}</i></p>`;
      if(q.w&&Object.keys(q.w).length){
        Object.keys(q.w).forEach(k=>{ body+=`<p style="margin:0 0 0 24pt;border-left:3px solid #c0392b;padding-left:8pt;color:#555;font-size:10pt"><b style="color:#c0392b">Why ${L[+k]} is wrong:</b> ${esc(q.w[k])}</p>`; });
      }
      body+=`<p style="margin-bottom:8pt"></p>`;
    });
  }

  // progress log
  body+=`<br style="page-break-before:always"/><h1 style="color:#1a2332">Progress Log</h1>
    <table width="100%" cellpadding="6" style="border:1px solid #ccc;border-collapse:collapse">
    <tr style="background:#1a2332;color:#fff"><td><b>Date</b></td><td><b>Cert / Week / Day</b></td><td><b>Score %</b></td><td><b>Notes</b></td></tr>`;
  completedLessons.forEach(({l,i})=>{const c=S.completed[i];
    body+=`<tr><td>${c.doneISO||''}</td><td>${esc(l.cert)} W${l.week} D${l.day}</td><td>${Math.round(c.ok/c.total*100)}%</td><td></td></tr>`;});
  body+=`</table>`;

  const html=`<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>SOC Path Study Guide</title>
    <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->
    <style>body{font-family:Arial,sans-serif;font-size:11pt;color:#000} h1{font-size:18pt} h2{font-size:14pt} h3{font-size:12pt} table{margin:4pt 0}</style>
    </head><body>${body}</body></html>`;

  try{
    const blob=new Blob(['\ufeff'+html],{type:'application/msword'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url;a.download=`SOC_Path_Study_Guide_${stamp}.doc`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    st.innerHTML=`<span style="color:var(--green)">✓ Downloaded. Opens in Word & Google Docs. Now save it to your Drive folder.</span>`;
  }catch(e){st.innerHTML=`<span style="color:var(--red)">Export failed: ${e.message}</span>`;}
}


function renderHow(){
  stage.innerHTML=`
    <div class="sec-label">HOW THIS TRAINER WORKS</div>
    <div class="term"><div class="t">🎚️ Pace you control</div><div class="d">THOROUGH loads every term + question (~50–75 min/day). BALANCED trims to the core 8+8. FASTER hits essentials only (6+6) to compress the timeline. Switch anytime up top — your call, week to week.</div></div>
    <div class="term"><div class="t">📅 One exam-mapped day at a time</div><div class="d">Each day targets specific CompTIA objectives (shown as a green pill). Order is A+ → Network+ → Security+. Week = Sun–Thu study, Fri/Sat off.</div></div>
    <div class="term"><div class="t">✅ Real work to advance</div><div class="d">A day counts only when you finish the hands-on practice tasks AND the knowledge check. No passive reading — the advance button stays locked until both are done.</div></div>
    <div class="term"><div class="t">⚠ No skipping</div><div class="d">If a study day passes uncompleted, Catch-up mode appears. You close the gap by finishing lessons, never by jumping ahead.</div></div>
    <div class="term"><div class="t">↑ 85% unlocks Tier-2</div><div class="d">Each week's checkpoint scores you. 85%+ layers advanced vocab into that cert — always growing.</div></div>
    <div class="term"><div class="t">🧒 Beginner-built, exam-grade</div><div class="d">Every term has a plain-English explanation AND an exam note tying it to what CompTIA actually tests. Nothing you learn is wasted.</div></div>
    <div class="term"><div class="t">🖥️ Labs after Day 4</div><div class="d">Step-by-step VirtualBox → VM → pfSense → Wireshark → SIEM. The SOC job in miniature.</div></div>
    <div class="mini">Timeline at your settings: ~8–9 months thorough · ~5–6 months faster. Progress saves on this device.</div>`;
}

document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset everything — days, streak, unlocks, pace?')){localStorage.removeItem(LS);S=freshState();mode="today";document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.mode==='today'));render();}};

/* -------- BACKUP: export / import progress -------- */
function flashHint(msg,color){const h=document.getElementById('backupHint');if(!h)return;const prev=h.textContent;h.textContent=msg;if(color)h.style.color=color;setTimeout(()=>{h.textContent=prev;h.style.color='';},4000);}

document.getElementById('exportBackupBtn').onclick=()=>{
  try{
    const payload={app:"soc-daily-trainer",fmt:1,savedISO:new Date().toISOString(),state:S};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download="soc-progress-"+todayISO()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    flashHint("✓ Backup downloaded. Move it to your other device, then tap 'restore progress' there.","var(--green)");
  }catch(e){flashHint("Couldn't create the backup file on this browser.","var(--red)");}
};

document.getElementById('importBackupBtn').onclick=()=>document.getElementById('importFile').click();

document.getElementById('importFile').onchange=(ev)=>{
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value=""; // allow re-importing same file later
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      const incoming=(obj&&obj.state)?obj.state:obj; // accept wrapped or raw
      if(!incoming||typeof incoming!=='object'||!('completed'in incoming)||!('pace'in incoming)){
        flashHint("That file doesn't look like a SOC trainer backup.","var(--red)");return;
      }
      const when=obj.savedISO?(" from "+obj.savedISO.slice(0,10)):"";
      if(!confirm("Restore progress"+when+"? This replaces the current progress on THIS device.")){flashHint("Restore cancelled — nothing changed.");return;}
      S=Object.assign(freshState(),incoming);
      saveState();
      mode="today";
      document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x.dataset.mode==='today'));
      render();
      flashHint("✓ Progress restored on this device.","var(--green)");
    }catch(e){flashHint("Couldn't read that file — is it the .json backup?","var(--red)");}
  };
  reader.onerror=()=>flashHint("Couldn't open that file.","var(--red)");
  reader.readAsText(file);
};

render();
</script>
